name=Automatic daylight saving time
summary=Turns Kia's Daylight Saving Time setting on and off by the calendar
description=Kia's clock uses a fixed time zone plus a manual Daylight Saving Time checkbox, so the clock is an hour off from March or November until someone ticks or unticks it. This follows the US and Canada rule (second Sunday in March to first Sunday in November) and flips Kia's own setting at the change, the same as ticking the box in Setup > General > Date & Time. It only acts on Kia's own UTC-offset time zones.
firmware=CVEV.USA.0000.V015.012.260507
kind=service
default=on
risk=normal
