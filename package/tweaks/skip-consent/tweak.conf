name=Skip start-up screen
summary=Goes straight to the home screen at start-up, without the consent / driver screen
description=At every start Kia's SystemUI shows a consent screen (and the driver profile picker) that has to be confirmed before anything else. This records the agreement the way the Confirm button does and never builds the screen. It changes SystemUI on /system: the patched code is rebuilt on the head unit from its own stock files, the stock files are backed up first and checked, and turning the tweak off puts them back exactly. Takes effect after the head unit restarts. If the head unit ever shows a black screen instead of the home screen, run restore-systemui.sh from a NEMESIS USB stick.
firmware=CVEV.USA.0000.V015.012.260507
kind=oneshot
default=off
risk=system
