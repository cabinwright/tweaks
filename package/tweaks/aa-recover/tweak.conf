name=Recover stuck wireless Android Auto
summary=Restarts Kia's Android Auto receiver when it gets stuck after the car's Wi-Fi hotspot was used
description=After the car's own Wi-Fi hotspot has used the radio, Kia's Android Auto receiver can get stuck in a "starting" state: the phone joins, times out and retries every few seconds, and wireless Android Auto never connects until the head unit restarts. This watches for that and restarts just the receiver, so the phone connects on its next try. It waits two minutes before acting again.
firmware=CVEV.USA.0000.V015.012.260507
kind=service
default=on
risk=normal
