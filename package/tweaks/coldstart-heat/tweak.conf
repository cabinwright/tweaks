name=Cold-start heat
summary=Turns on the heated wheel and seats when it's cold
description=When the head unit starts and it's cold outside, turns on the heated steering wheel and any heated seats you chose. Set the temperature and the seats in Car Controls; without that app, the steering wheel comes on below 50°F. Not yet tested on an EV6, so check it while parked first. Switching the car off and on doesn't always restart the head unit, so it may not run on every drive.
firmware=CVEV.USA.0000.V015.012.260507
kind=service
default=off
risk=normal
