name=Cold-start heat
summary=Turns on the heated wheel and driver's seat when it's cold
description=When the head unit starts and it's below 50°F outside, turns on the heated steering wheel and the driver's seat. Switching the car off and on doesn't always restart the head unit, so it may not run on every drive.
firmware=CVEV.USA.0000.V015.012.260507
kind=service
default=off
need=dump:com.hkmc.micom.datc | Read the outside temperature from the climate system
need=binder:com.hkmc.vr 16 | Turn on the heated steering wheel
need=binder:com.hkmc.micom.usm 213 | Turn on the heated driver's seat
