name=Keep wireless projection working with ADB TCP
summary=Stops the Engineering Mode "ADB TCP" switch from breaking wireless Android Auto and CarPlay
description=With Engineering Mode > ADB TCP switched on, the head unit gives its internal Ethernet port 192.168.0.123/24 at start-up. That is the same network as the car's projection hotspot, so replies to the phone go out the wrong port and wireless Android Auto and CarPlay never connect. This re-runs Kia's own address setup with a one-address netmask, so the hotspot gets its network back. ADB over the network keeps working. Does nothing while the ADB TCP switch is off.
firmware=CVEV.USA.0000.V015.012.260507
kind=service
default=on
risk=normal
